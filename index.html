<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P.I.F.E SONG</title>
<style>
  :root {
    --blue-deep: #0d3b66;
    --blue: #1c66b3;
    --blue-bright: #2f8fe0;
    --blue-light: #eaf3fc;
    --bg: #f4f8fd;
    --card: #ffffff;
    --border: #dbe7f5;
    --text: #16233a;
    --muted: #6b7d94;
    --gold: #d8b25c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Tahoma, Vazirmatn, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* هدر گرادیانت با موج تزئینی */
  header {
    background: linear-gradient(135deg, var(--blue-deep), var(--blue) 60%, var(--blue-bright));
    padding: 34px 16px 46px;
    text-align: center;
    position: relative;
    overflow: hidden;
    border-radius: 0 0 28px 28px;
  }
  header::before {
    content: "♪ ♫ ♪";
    position: absolute;
    top: 12px; left: 20px;
    color: rgba(255,255,255,.12);
    font-size: 26px;
    letter-spacing: 8px;
  }
  header::after {
    content: "♫ ♪ ♫";
    position: absolute;
    bottom: 10px; right: 20px;
    color: rgba(255,255,255,.10);
    font-size: 22px;
    letter-spacing: 8px;
  }
  .logo {
    font-size: 40px;
    font-style: italic;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1.5px;
    text-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  .tagline {
    color: rgba(255,255,255,.75);
    font-size: 12px;
    margin-top: 4px;
    letter-spacing: 2px;
  }

  /* موج صوتی تزئینی */
  .wave {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 4px;
    height: 30px;
    margin-top: 18px;
  }
  .wave span {
    width: 4px;
    border-radius: 3px;
    background: rgba(255,255,255,.55);
    animation: bounce 1.4s ease-in-out infinite;
  }
  .wave span:nth-child(1){height:35%;animation-delay:0s;}
  .wave span:nth-child(2){height:70%;animation-delay:.1s;}
  .wave span:nth-child(3){height:100%;animation-delay:.2s;}
  .wave span:nth-child(4){height:55%;animation-delay:.3s;}
  .wave span:nth-child(5){height:85%;animation-delay:.4s;}
  .wave span:nth-child(6){height:40%;animation-delay:.5s;}
  .wave span:nth-child(7){height:65%;animation-delay:.6s;}
  .wave span:nth-child(8){height:25%;animation-delay:.7s;}
  @keyframes bounce {
    0%, 100% { transform: scaleY(.5); opacity:.6; }
    50% { transform: scaleY(1); opacity:1; }
  }

  .search-wrap {
    max-width: 480px;
    margin: -24px auto 0;
    padding: 0 16px;
    position: relative;
    z-index: 2;
  }
  #search {
    width: 100%;
    padding: 14px 18px;
    border-radius: 16px;
    border: none;
    font-size: 15px;
    text-align: right;
    background: #fff;
    box-shadow: 0 8px 24px rgba(13,59,102,.15);
  }
  #search:focus { outline: 2px solid var(--blue-bright); }

  .label-pill {
    display: block;
    width: fit-content;
    margin: 22px auto 20px;
    background: linear-gradient(135deg, var(--blue), var(--blue-bright));
    color: #fff;
    padding: 9px 26px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 14px;
    box-shadow: 0 4px 14px rgba(28,102,179,.3);
  }

  #grid {
    max-width: 920px;
    margin: 0 auto;
    padding: 0 16px 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
  }
  .singer-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px 12px;
    text-align: center;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .singer-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 22px rgba(13,59,102,.12);
  }
  .singer-photo {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    margin: 0 auto 10px;
    background: var(--blue-light) center/cover no-repeat;
    padding: 3px;
    position: relative;
  }
  .singer-photo::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, var(--blue-bright), var(--gold));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: -1;
  }
  .singer-name { font-weight: 700; font-size: 14.5px; }
  .singer-count {
    display: inline-block;
    margin-top: 7px;
    font-size: 11px;
    color: var(--blue);
    background: var(--blue-light);
    padding: 3px 11px;
    border-radius: 10px;
  }

  #songsView {
    display: none;
    max-width: 620px;
    margin: 0 auto;
    padding: 20px 16px 110px;
  }
  .back-btn {
    background: var(--blue-light);
    border: none;
    color: var(--blue);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 16px;
    padding: 8px 16px;
    border-radius: 12px;
  }
  .songs-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
    background: linear-gradient(135deg, var(--blue-light), #fff);
    padding: 16px;
    border-radius: 16px;
  }
  .songs-header .singer-photo { margin: 0; width: 62px; height: 62px; }
  .song-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 9px;
    cursor: pointer;
    transition: box-shadow .15s ease;
  }
  .song-row:hover { box-shadow: 0 4px 14px rgba(13,59,102,.10); }
  .song-row .num {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--blue-light);
    color: var(--blue);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; flex-shrink: 0;
  }
  .song-row .title { flex: 1; font-size: 14px; }
  .empty-note {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 40px 10px;
  }

  /* پلیر پایین با حس وینیل */
  #player {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(135deg, var(--blue-deep), var(--blue));
    color: #fff;
    padding: 12px 18px;
    display: none;
    align-items: center;
    gap: 14px;
    box-shadow: 0 -6px 20px rgba(13,59,102,.25);
  }
  #player.active { display: flex; }
  .vinyl {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--gold) 0 3px, #1a1a1a 4px 60%, #333 61% 100%);
    flex-shrink: 0;
    animation: spin 3s linear infinite;
  }
  #player.paused .vinyl { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #player .info { flex: 1; min-width: 0; }
  #player .info .t { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #player .info .s { font-size: 11px; opacity: .8; }
  #player audio { display: none; }
  #player button {
    background: rgba(255,255,255,.15);
    border: none;
    color: #fff;
    width: 38px; height: 38px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #player button:hover { background: rgba(255,255,255,.25); }
  #player .mini-controls { display: flex; align-items: center; gap: 6px; }
  #player .mini-controls button.small { width: 32px; height: 32px; font-size: 13px; }
  #player .info { cursor: pointer; }

  .fav-btn {
    background: transparent !important;
    color: rgba(255,255,255,.65);
    font-size: 18px !important;
  }
  .fav-btn.active { color: #ff4d6d; }
  .song-row .fav-btn {
    background: transparent !important;
    color: var(--border);
    font-size: 17px;
    border: none;
    cursor: pointer;
    padding: 4px;
    flex-shrink: 0;
  }
  .song-row .fav-btn.active { color: #ff4d6d; }
  .song-row.playing { border-color: var(--blue-bright); background: var(--blue-light); }
  .song-row .num.loading::after {
    content: "";
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--blue);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }

  /* صفحه پخش تمام‌صفحه */
  #nowPlaying {
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, var(--blue-deep), var(--blue) 55%, var(--blue-bright));
    color: #fff;
    z-index: 50;
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 22px 24px 34px;
  }
  #nowPlaying.active { display: flex; }
  .np-top {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .np-top button {
    background: rgba(255,255,255,.15);
    border: none;
    color: #fff;
    width: 38px; height: 38px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
  }
  .np-cover {
    width: min(62vw, 260px);
    height: min(62vw, 260px);
    border-radius: 50%;
    background: var(--blue-light) center/cover no-repeat;
    margin: 34px auto 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
    border: 5px solid rgba(255,255,255,.15);
    animation: spin 8s linear infinite;
  }
  #nowPlaying.paused .np-cover { animation-play-state: paused; }
  .np-title { font-size: 20px; font-weight: 700; text-align: center; }
  .np-singer { font-size: 13px; opacity: .75; margin-top: 6px; text-align: center; }
  .np-progress {
    width: 100%;
    max-width: 420px;
    margin-top: 26px;
  }
  .np-progress input[type=range] {
    width: 100%;
    accent-color: #fff;
  }
  .np-times {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    opacity: .7;
    margin-top: -4px;
  }
  .np-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    margin-top: 20px;
  }
  .np-controls button {
    background: rgba(255,255,255,.15);
    border: none;
    color: #fff;
    cursor: pointer;
  }
  .np-controls .np-play {
    width: 66px; height: 66px;
    border-radius: 50%;
    font-size: 24px;
    background: #fff;
    color: var(--blue-deep);
  }
  .np-controls .np-nav {
    width: 46px; height: 46px;
    border-radius: 50%;
    font-size: 18px;
  }
  .np-heart {
    margin-top: 26px;
    background: transparent;
    border: none;
    color: rgba(255,255,255,.6);
    font-size: 26px;
    cursor: pointer;
  }
  .np-heart.active { color: #ff4d6d; }
</style>
</head>
<body>

<header>
  <div class="logo">P.I.F.E</div>
  <div class="tagline">SONG</div>
  <div class="wave">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>
</header>

<div class="search-wrap">
  <input id="search" type="text" placeholder="جستجوی خواننده یا آهنگ" />
</div>

<div id="pillsWrap" style="display:flex; justify-content:center; gap:10px; align-items:center;">
  <div class="label-pill" style="margin:22px 0 20px;">خواننده‌ها</div>
  <button class="label-pill" style="margin:22px 0 20px; background:linear-gradient(135deg,#ff4d6d,#ff8fa3); cursor:pointer; border:none;" onclick="showFavorites()">♥ علاقه‌مندی‌ها</button>
</div>

<div id="grid"></div>

<div id="songsView">
  <button class="back-btn" onclick="showGrid()">→ بازگشت</button>
  <div class="songs-header">
    <div class="singer-photo" id="songsPhoto"></div>
    <div>
      <div id="songsName" style="font-weight:700;font-size:18px;"></div>
      <div class="singer-count" id="songsCount"></div>
    </div>
  </div>
  <div id="songsList"></div>
</div>

<div id="player">
  <div class="vinyl" onclick="openNowPlaying()"></div>
  <div class="info" onclick="openNowPlaying()">
    <div class="t" id="pTitle">-</div>
    <div class="s" id="pSinger">-</div>
  </div>
  <div class="mini-controls">
    <button class="small fav-btn" id="miniFavBtn" onclick="toggleFavoriteCurrent(event)">♡</button>
    <button class="small" onclick="prevSong(event)">⏮</button>
    <button onclick="togglePlay(event)" id="playBtn">▶</button>
    <button class="small" onclick="nextSong(event)">⏭</button>
  </div>
  <audio id="audio" preload="auto"></audio>
</div>

<div id="nowPlaying">
  <div class="np-top">
    <button onclick="closeNowPlaying()">✕</button>
    <div style="font-size:12px;opacity:.8;">در حال پخش</div>
    <div style="width:38px;"></div>
  </div>
  <div class="np-cover" id="npCover"></div>
  <div class="np-title" id="npTitle">-</div>
  <div class="np-singer" id="npSinger">-</div>
  <div class="np-progress">
    <input type="range" id="npSeek" min="0" max="100" value="0">
    <div class="np-times">
      <span id="npCur">0:00</span>
      <span id="npDur">0:00</span>
    </div>
  </div>
  <div class="np-controls">
    <button class="np-nav" onclick="prevSong(event)">⏮</button>
    <button class="np-play" onclick="togglePlay(event)" id="npPlayBtn">▶</button>
    <button class="np-nav" onclick="nextSong(event)">⏭</button>
  </div>
  <button class="np-heart" id="npHeartBtn" onclick="toggleFavoriteCurrent(event)">♡</button>
</div>

<script>
// آدرس ریپازیتوری GitHub شما
const GH_USER = "rezaeian1388-bot";
const GH_REPO = "P.I.F.E";
const BASE_URL = `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main`;
const API_URL = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/songs`;

// همه ۱۷ خواننده. "slug" = اسم پوشه‌ای که باید توی songs/ بسازید (لاتین، ساده)
const singers = [
  { id: 1,  name: "گوگوش",          slug: "googoosh",              photo: "1.jpg",  songs: [] },
  { id: 2,  name: "هایده",          slug: "hayedeh",               photo: "2.jpg",  songs: [] },
  { id: 3,  name: "مهستی",          slug: "mahasti",               photo: "3.jpg",  songs: [] },
  { id: 4,  name: "حمیرا",          slug: "homeira",               photo: "4.jpg",  songs: [] },
  { id: 5,  name: "ویگن",           slug: "vigen",                 photo: "5.jpg",  songs: [] },
  { id: 6,  name: "داریوش",         slug: "dariush",               photo: "6.jpg",  songs: [] },
  { id: 7,  name: "ابی",            slug: "ebi",                   photo: "7.jpg",  songs: [] },
  { id: 8,  name: "عارف",           slug: "aref",                  photo: "8.jpg",  songs: [] },
  { id: 9,  name: "سیاوش قمیشی",    slug: "siavash-ghomayshi",     photo: "9.jpg",  songs: [] },
  { id: 10, name: "ستار",           slug: "sattar",                photo: "10.jpg", songs: [] },
  { id: 11, name: "شاهرخ",          slug: "shahrokh",              photo: "11.jpg", songs: [] },
  { id: 12, name: "حسن شماعی‌زاده", slug: "hassan-shamaeezadeh",   photo: "12.jpg", songs: [] },
  { id: 13, name: "معین",           slug: "moein",                 photo: "13.jpg", songs: [] },
  { id: 14, name: "حبیب",           slug: "habib",                 photo: "14.jpg", songs: [] },
  { id: 15, name: "لیلا فروهر",     slug: "leila-forouhar",        photo: "15.jpg", songs: [] },
  { id: 16, name: "ایرج",           slug: "iraj",                  photo: "16.jpg", songs: [] },
  { id: 17, name: "فتانه",          slug: "fataneh",               photo: "17.jpg", songs: [] }
];

// تبدیل تقریبی فینگیلیش به فارسی (بهترین حدس، نه ترجمه دقیق)
function finglishToPersian(text) {
  let s = text.toLowerCase();
  const map = [
    ['kh','خ'],['gh','ق'],['sh','ش'],['ch','چ'],['zh','ژ'],['th','ث'],['ph','ف'],
    ['aa','آ'],['ee','ی'],['oo','و'],['ou','و'],['ei','ی'],
    ['a','ا'],['b','ب'],['c','ک'],['d','د'],['e','ه'],['f','ف'],
    ['g','گ'],['h','ه'],['i','ی'],['j','ج'],['k','ک'],['l','ل'],
    ['m','م'],['n','ن'],['o','و'],['p','پ'],['q','ق'],['r','ر'],
    ['s','س'],['t','ت'],['u','و'],['v','و'],['w','و'],['y','ی'],['z','ز']
  ];
  let out = '', i = 0;
  while (i < s.length) {
    if (s[i] === ' ') { out += ' '; i++; continue; }
    let matched = false;
    for (const [lat, per] of map) {
      if (s.startsWith(lat, i)) { out += per; i += lat.length; matched = true; break; }
    }
    if (!matched) i++;
  }
  return out;
}

// پاکسازی اسم فایل: حذف پسوند، پرانتز، عدد کیفیت، خط تیره/زیرخط، اسم خواننده
function cleanTitle(filename, singerSlug) {
  let name = filename.replace(/\.[a-zA-Z0-9]+$/, '');
  name = name.replace(/\(.*?\)/g, ' ');
  name = name.replace(/[_-]/g, ' ');
  name = name.replace(/\b\d{2,4}\b/g, ' ');
  const singerRegex = new RegExp(singerSlug.replace(/-/g, '.?'), 'gi');
  name = name.replace(singerRegex, ' ');
  name = name.trim().replace(/\s+/g, ' ');
  return finglishToPersian(name) || name;
}

// خواندن لیست فایل‌های آهنگ هر خواننده مستقیم از GitHub
async function fetchSongs(singer) {
  try {
    const res = await fetch(`${API_URL}/${singer.slug}`);
    if (!res.ok) return [];
    const data = await res.json();
    return data
      .filter(f => f.type === 'file')
      .map(f => ({ title: cleanTitle(f.name, singer.slug), file: f.download_url }));
  } catch (e) {
    return [];
  }
}

const grid = document.getElementById('grid');
const songsView = document.getElementById('songsView');
const searchInput = document.getElementById('search');

function photoStyle(photo) {
  return `background-image:url('${BASE_URL}/${photo}')`;
}

function renderGrid(list) {
  grid.innerHTML = '';
  list.forEach(s => {
    const card = document.createElement('div');
    card.className = 'singer-card';
    card.onclick = () => openSinger(s.id);
    card.innerHTML = `
      <div class="singer-photo" style="${photoStyle(s.photo)}"></div>
      <div class="singer-name">${s.name}</div>
      <div class="singer-count">${s.songs.length} آهنگ</div>
    `;
    grid.appendChild(card);
  });
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  if (!q) { renderGrid(singers); return; }
  const filtered = singers.filter(s =>
    s.name.includes(q) || s.songs.some(sg => sg.title.includes(q))
  );
  renderGrid(filtered);
});

async function openSinger(id) {
  const s = singers.find(x => x.id === id);
  document.querySelector('.search-wrap').style.display = 'none';
  document.getElementById('pillsWrap').style.display = 'none';
  grid.style.display = 'none';
  songsView.style.display = 'block';

  document.getElementById('songsPhoto').style = photoStyle(s.photo);
  document.getElementById('songsName').textContent = s.name;
  document.getElementById('songsCount').textContent = '...';

  const list = document.getElementById('songsList');
  list.innerHTML = `<div class="empty-note">در حال دریافت آهنگ‌ها...</div>`;

  const songs = await fetchSongs(s);
  document.getElementById('songsCount').textContent = songs.length + ' آهنگ';

  if (songs.length === 0) {
    list.innerHTML = `<div class="empty-note">هنوز آهنگی برای ${s.name} آپلود نشده (پوشه songs/${s.slug}/ رو چک کنید).</div>`;
    return;
  }
  list.innerHTML = '';
  songs.forEach((song, i) => {
    const row = document.createElement('div');
    row.className = 'song-row';
    row.dataset.file = song.file;
    row.onclick = () => { playSong(songs, i, s.name, s.photo); openNowPlaying(); };
    const fav = isFavorite(song) ? 'active' : '';
    const favBtn = document.createElement('button');
    favBtn.className = 'fav-btn ' + fav;
    favBtn.textContent = fav ? '♥' : '♡';
    favBtn.onclick = (e) => { e.stopPropagation(); toggleFavoriteSong(song, s.name, favBtn); };
    row.innerHTML = `<span class="num">${i + 1}</span><span class="title">${song.title}</span>`;
    row.appendChild(favBtn);
    const playSpan = document.createElement('span');
    playSpan.textContent = '▶';
    row.appendChild(playSpan);
    list.appendChild(row);
  });
  markPlayingRow();
}

function showFavorites() {
  const favs = getFavorites();
  document.querySelector('.search-wrap').style.display = 'none';
  document.getElementById('pillsWrap').style.display = 'none';
  grid.style.display = 'none';
  songsView.style.display = 'block';

  document.getElementById('songsPhoto').style = 'background:linear-gradient(135deg,#ff4d6d,#ff8fa3)';
  document.getElementById('songsPhoto').innerHTML = '';
  document.getElementById('songsName').textContent = 'علاقه‌مندی‌ها';
  document.getElementById('songsCount').textContent = favs.length + ' آهنگ';

  const list = document.getElementById('songsList');
  if (favs.length === 0) {
    list.innerHTML = `<div class="empty-note">هنوز آهنگی را به علاقه‌مندی‌ها اضافه نکرده‌اید. روی قلب کنار هر آهنگ بزنید ♡</div>`;
    return;
  }
  const favSongs = favs.map(f => ({ title: f.title, file: f.file }));
  list.innerHTML = '';
  favSongs.forEach((song, i) => {
    const row = document.createElement('div');
    row.className = 'song-row';
    row.dataset.file = song.file;
    row.onclick = () => { playSong(favSongs, i, favs[i].singer); openNowPlaying(); };
    const favBtn = document.createElement('button');
    favBtn.className = 'fav-btn active';
    favBtn.textContent = '♥';
    favBtn.onclick = (e) => {
      e.stopPropagation();
      toggleFavoriteSong(song, favs[i].singer, favBtn);
      showFavorites();
    };
    row.innerHTML = `<span class="num">${i + 1}</span><span class="title">${song.title}</span>`;
    row.appendChild(favBtn);
    const playSpan = document.createElement('span');
    playSpan.textContent = '▶';
    row.appendChild(playSpan);
    list.appendChild(row);
  });
  markPlayingRow();
}

function showGrid() {
  document.querySelector('.search-wrap').style.display = 'block';
  document.getElementById('pillsWrap').style.display = 'flex';
  grid.style.display = 'grid';
  songsView.style.display = 'none';
}

const audio = document.getElementById('audio');
const player = document.getElementById('player');
const playBtn = document.getElementById('playBtn');
const nowPlaying = document.getElementById('nowPlaying');
const npPlayBtn = document.getElementById('npPlayBtn');
const npSeek = document.getElementById('npSeek');
const npCur = document.getElementById('npCur');
const npDur = document.getElementById('npDur');
const miniFavBtn = document.getElementById('miniFavBtn');
const npHeartBtn = document.getElementById('npHeartBtn');

// ------- علاقه‌مندی‌ها (localStorage) -------
const FAV_KEY = 'pife_favorites';
function getFavorites() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; }
  catch (e) { return []; }
}
function saveFavorites(list) {
  localStorage.setItem(FAV_KEY, JSON.stringify(list));
}
function isFavorite(song) {
  return getFavorites().some(f => f.file === song.file);
}
function toggleFavoriteSong(song, singerName, btnEl) {
  let favs = getFavorites();
  const idx = favs.findIndex(f => f.file === song.file);
  if (idx >= 0) {
    favs.splice(idx, 1);
    if (btnEl) { btnEl.classList.remove('active'); btnEl.textContent = '♡'; }
  } else {
    favs.push({ file: song.file, title: song.title, singer: singerName });
    if (btnEl) { btnEl.classList.add('active'); btnEl.textContent = '♥'; }
  }
  saveFavorites(favs);
  refreshHeartButtons();
}
function toggleFavoriteCurrent(e) {
  if (e) e.stopPropagation();
  if (!currentList.length) return;
  const song = currentList[currentIndex];
  toggleFavoriteSong(song, currentSinger, null);
  refreshHeartButtons();
  // به‌روزرسانی دکمه قلب داخل لیست آهنگ‌ها هم اگر همان صفحه باز است
  const row = document.querySelector(`.song-row[data-file="${CSS.escape(song.file)}"] .fav-btn`);
  if (row) {
    const active = isFavorite(song);
    row.classList.toggle('active', active);
    row.textContent = active ? '♥' : '♡';
  }
}
function refreshHeartButtons() {
  if (!currentList.length) return;
  const active = isFavorite(currentList[currentIndex]);
  [miniFavBtn, npHeartBtn].forEach(btn => {
    btn.classList.toggle('active', active);
    btn.textContent = active ? '♥' : '♡';
  });
}

// ------- پخش‌کننده -------
let currentList = [];
let currentIndex = -1;
let currentSinger = '';
let currentSingerPhoto = '';

function markPlayingRow() {
  document.querySelectorAll('.song-row').forEach(r => r.classList.remove('playing'));
  if (currentIndex >= 0 && currentList[currentIndex]) {
    const row = document.querySelector(`.song-row[data-file="${CSS.escape(currentList[currentIndex].file)}"]`);
    if (row) row.classList.add('playing');
  }
}

function playSong(list, index, singerName, singerPhoto) {
  currentList = list;
  currentIndex = index;
  currentSinger = singerName;
  if (singerPhoto) currentSingerPhoto = singerPhoto;
  const song = list[index];
  if (!song) return;

  audio.src = `${BASE_URL}/${song.file}`;
  audio.play().catch(() => {});
  player.classList.add('active');
  player.classList.remove('paused');
  nowPlaying.classList.remove('paused');
  document.getElementById('pTitle').textContent = song.title;
  document.getElementById('pSinger').textContent = singerName;
  playBtn.textContent = '⏸';

  document.getElementById('npTitle').textContent = song.title;
  document.getElementById('npSinger').textContent = singerName;
  npPlayBtn.textContent = '⏸';
  if (currentSingerPhoto) {
    document.getElementById('npCover').style.backgroundImage = `url('${BASE_URL}/${currentSingerPhoto}')`;
  }
  npSeek.value = 0;
  npCur.textContent = '0:00';
  npDur.textContent = '0:00';

  refreshHeartButtons();
  markPlayingRow();
}

function nextSong(e) {
  if (e) e.stopPropagation();
  if (!currentList.length) return;
  const newIndex = (currentIndex + 1) % currentList.length;
  playSong(currentList, newIndex, currentSinger, currentSingerPhoto);
}

function prevSong(e) {
  if (e) e.stopPropagation();
  if (!currentList.length) return;
  const newIndex = (currentIndex - 1 + currentList.length) % currentList.length;
  playSong(currentList, newIndex, currentSinger, currentSingerPhoto);
}

function togglePlay(e) {
  if (e) e.stopPropagation();
  if (audio.paused) {
    audio.play().catch(() => {});
    playBtn.textContent = '⏸';
    npPlayBtn.textContent = '⏸';
    player.classList.remove('paused');
    nowPlaying.classList.remove('paused');
  } else {
    audio.pause();
    playBtn.textContent = '▶';
    npPlayBtn.textContent = '▶';
    player.classList.add('paused');
    nowPlaying.classList.add('paused');
  }
}

// وقتی آهنگ تمام شد، خودکار برو سراغ بعدی
audio.addEventListener('ended', () => nextSong());

// نوار پیشرفت
function formatTime(t) {
  if (!isFinite(t)) return '0:00';
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}
audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    npSeek.value = (audio.currentTime / audio.duration) * 100;
    npCur.textContent = formatTime(audio.currentTime);
    npDur.textContent = formatTime(audio.duration);
  }
});
npSeek.addEventListener('input', () => {
  if (audio.duration) {
    audio.currentTime = (npSeek.value / 100) * audio.duration;
  }
});

// صفحه تمام‌صفحه پخش
function openNowPlaying() {
  if (!currentList.length) return;
  nowPlaying.classList.add('active');
}
function closeNowPlaying() {
  nowPlaying.classList.remove('active');
}

renderGrid(singers);
</script>
