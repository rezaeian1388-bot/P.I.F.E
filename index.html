<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P.I.F.E SONG</title>
<style>
  :root {
    --blue-deep: #0d3b66;
    --blue: #1c66b3;
    --blue-bright: #2f8fe0;
    --blue-light: #eaf3fc;
    --bg: #f4f8fd;
    --card: #ffffff;
    --border: #dbe7f5;
    --text: #16233a;
    --muted: #6b7d94;
    --gold: #d8b25c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Tahoma, Vazirmatn, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* هدر گرادیانت با موج تزئینی */
  header {
    background: linear-gradient(135deg, var(--blue-deep), var(--blue) 60%, var(--blue-bright));
    padding: 34px 16px 46px;
    text-align: center;
    position: relative;
    overflow: hidden;
    border-radius: 0 0 28px 28px;
  }
  header::before {
    content: "♪ ♫ ♪";
    position: absolute;
    top: 12px; left: 20px;
    color: rgba(255,255,255,.12);
    font-size: 26px;
    letter-spacing: 8px;
  }
  header::after {
    content: "♫ ♪ ♫";
    position: absolute;
    bottom: 10px; right: 20px;
    color: rgba(255,255,255,.10);
    font-size: 22px;
    letter-spacing: 8px;
  }
  .logo {
    font-size: 40px;
    font-style: italic;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1.5px;
    text-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  .tagline {
    color: rgba(255,255,255,.75);
    font-size: 12px;
    margin-top: 4px;
    letter-spacing: 2px;
  }

  /* موج صوتی تزئینی */
  .wave {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 4px;
    height: 30px;
    margin-top: 18px;
  }
  .wave span {
    width: 4px;
    border-radius: 3px;
    background: rgba(255,255,255,.55);
    animation: bounce 1.4s ease-in-out infinite;
  }
  .wave span:nth-child(1){height:35%;animation-delay:0s;}
  .wave span:nth-child(2){height:70%;animation-delay:.1s;}
  .wave span:nth-child(3){height:100%;animation-delay:.2s;}
  .wave span:nth-child(4){height:55%;animation-delay:.3s;}
  .wave span:nth-child(5){height:85%;animation-delay:.4s;}
  .wave span:nth-child(6){height:40%;animation-delay:.5s;}
  .wave span:nth-child(7){height:65%;animation-delay:.6s;}
  .wave span:nth-child(8){height:25%;animation-delay:.7s;}
  @keyframes bounce {
    0%, 100% { transform: scaleY(.5); opacity:.6; }
    50% { transform: scaleY(1); opacity:1; }
  }

  .search-wrap {
    max-width: 480px;
    margin: -24px auto 0;
    padding: 0 16px;
    position: relative;
    z-index: 2;
  }
  #search {
    width: 100%;
    padding: 14px 18px;
    border-radius: 16px;
    border: none;
    font-size: 15px;
    text-align: right;
    background: #fff;
    box-shadow: 0 8px 24px rgba(13,59,102,.15);
  }
  #search:focus { outline: 2px solid var(--blue-bright); }

  .label-pill {
    display: block;
    width: fit-content;
    margin: 22px auto 20px;
    background: linear-gradient(135deg, var(--blue), var(--blue-bright));
    color: #fff;
    padding: 9px 26px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 14px;
    box-shadow: 0 4px 14px rgba(28,102,179,.3);
  }

  #grid {
    max-width: 920px;
    margin: 0 auto;
    padding: 0 16px 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
  }
  .singer-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px 12px;
    text-align: center;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .singer-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 22px rgba(13,59,102,.12);
  }
  .singer-photo {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    margin: 0 auto 10px;
    background: var(--blue-light) center/cover no-repeat;
    padding: 3px;
    position: relative;
  }
  .singer-photo::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, var(--blue-bright), var(--gold));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: -1;
  }
  .singer-name { font-weight: 700; font-size: 14.5px; }
  .singer-count {
    display: inline-block;
    margin-top: 7px;
    font-size: 11px;
    color: var(--blue);
    background: var(--blue-light);
    padding: 3px 11px;
    border-radius: 10px;
  }

  #songsView {
    display: none;
    max-width: 620px;
    margin: 0 auto;
    padding: 20px 16px 110px;
  }
  .back-btn {
    background: var(--blue-light);
    border: none;
    color: var(--blue);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 16px;
    padding: 8px 16px;
    border-radius: 12px;
  }
  .songs-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
    background: linear-gradient(135deg, var(--blue-light), #fff);
    padding: 16px;
    border-radius: 16px;
  }
  .songs-header .singer-photo { margin: 0; width: 62px; height: 62px; }
  .song-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 9px;
    cursor: pointer;
    transition: box-shadow .15s ease;
  }
  .song-row:hover { box-shadow: 0 4px 14px rgba(13,59,102,.10); }
  .song-row .num {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--blue-light);
    color: var(--blue);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; flex-shrink: 0;
  }
  .song-row .title { flex: 1; font-size: 14px; }
  .empty-note {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 40px 10px;
  }

  /* پلیر پایین با حس وینیل */
  #player {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(135deg, var(--blue-deep), var(--blue));
    color: #fff;
    padding: 12px 18px;
    display: none;
    align-items: center;
    gap: 14px;
    box-shadow: 0 -6px 20px rgba(13,59,102,.25);
  }
  #player.active { display: flex; }
  .vinyl {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--gold) 0 3px, #1a1a1a 4px 60%, #333 61% 100%);
    flex-shrink: 0;
    animation: spin 3s linear infinite;
  }
  #player.paused .vinyl { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #player .info { flex: 1; min-width: 0; }
  #player .info .t { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #player .info .s { font-size: 11px; opacity: .8; }
  #player audio { display: none; }
  #player button {
    background: rgba(255,255,255,.15);
    border: none;
    color: #fff;
    width: 38px; height: 38px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
  }
  #player button:hover { background: rgba(255,255,255,.25); }
</style>
</head>
<body>

<header>
  <div class="logo">P.I.F.E</div>
  <div class="tagline">SONG</div>
  <div class="wave">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>
</header>

<div class="search-wrap">
  <input id="search" type="text" placeholder="جستجوی خواننده یا آهنگ" />
</div>

<div class="label-pill">خواننده‌ها</div>

<div id="grid"></div>

<div id="songsView">
  <button class="back-btn" onclick="showGrid()">→ بازگشت</button>
  <div class="songs-header">
    <div class="singer-photo" id="songsPhoto"></div>
    <div>
      <div id="songsName" style="font-weight:700;font-size:18px;"></div>
      <div class="singer-count" id="songsCount"></div>
    </div>
  </div>
  <div id="songsList"></div>
</div>

<div id="player">
  <div class="vinyl"></div>
  <div class="info">
    <div class="t" id="pTitle">-</div>
    <div class="s" id="pSinger">-</div>
  </div>
  <button onclick="togglePlay()" id="playBtn">▶</button>
  <audio id="audio"></audio>
</div>

<script>
// آدرس پایه فایل‌ها روی GitHub (repo: rezaeian1388-bot/P.I.F.E)
// اگر اسم ریپازیتوری یا یوزرنیم فرق کرد، همین خط رو عوض کنید
const BASE_URL = "https://raw.githubusercontent.com/rezaeian1388-bot/P.I.F.E/main";

// همه ۱۷ خواننده. فیلد songs را با آهنگ‌های واقعی هر خواننده پر کنید:
// { title: "اسم فارسی آهنگ", file: "songs/<pooshe>/<file>.m4a" }
const singers = [
  { id: 1,  name: "گوگوش",          photo: "1.jpg",  songs: [] },
  { id: 2,  name: "هایده",          photo: "2.jpg",  songs: [] },
  { id: 3,  name: "مهستی",          photo: "3.jpg",  songs: [] },
  { id: 4,  name: "حمیرا",          photo: "4.jpg",  songs: [] },
  { id: 5,  name: "ویگن",           photo: "5.jpg",  songs: [] },
  { id: 6,  name: "داریوش",         photo: "6.jpg",  songs: [] },
  { id: 7,  name: "ابی",            photo: "7.jpg",  songs: [] },
  { id: 8,  name: "عارف",           photo: "8.jpg",  songs: [] },
  { id: 9,  name: "سیاوش قمیشی",    photo: "9.jpg",  songs: [] },
  { id: 10, name: "ستار",           photo: "10.jpg", songs: [] },
  { id: 11, name: "شاهرخ",          photo: "11.jpg", songs: [] },
  { id: 12, name: "حسن شماعی‌زاده", photo: "12.jpg", songs: [] },
  { id: 13, name: "معین",           photo: "13.jpg", songs: [] },
  { id: 14, name: "حبیب",           photo: "14.jpg", songs: [] },
  { id: 15, name: "لیلا فروهر",     photo: "15.jpg", songs: [] },
  { id: 16, name: "ایرج",           photo: "16.jpg", songs: [] },
  { id: 17, name: "فتانه",          photo: "17.jpg", songs: [] }
];

const grid = document.getElementById('grid');
const songsView = document.getElementById('songsView');
const searchInput = document.getElementById('search');

function photoStyle(photo) {
  return `background-image:url('${BASE_URL}/${photo}')`;
}

function renderGrid(list) {
  grid.innerHTML = '';
  list.forEach(s => {
    const card = document.createElement('div');
    card.className = 'singer-card';
    card.onclick = () => openSinger(s.id);
    card.innerHTML = `
      <div class="singer-photo" style="${photoStyle(s.photo)}"></div>
      <div class="singer-name">${s.name}</div>
      <div class="singer-count">${s.songs.length} آهنگ</div>
    `;
    grid.appendChild(card);
  });
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  if (!q) { renderGrid(singers); return; }
  const filtered = singers.filter(s =>
    s.name.includes(q) || s.songs.some(sg => sg.title.includes(q))
  );
  renderGrid(filtered);
});

function openSinger(id) {
  const s = singers.find(x => x.id === id);
  document.querySelector('.search-wrap').style.display = 'none';
  document.querySelector('.label-pill').style.display = 'none';
  grid.style.display = 'none';
  songsView.style.display = 'block';

  document.getElementById('songsPhoto').style = photoStyle(s.photo);
  document.getElementById('songsName').textContent = s.name;
  document.getElementById('songsCount').textContent = s.songs.length + ' آهنگ';

  const list = document.getElementById('songsList');
  if (s.songs.length === 0) {
    list.innerHTML = `<div class="empty-note">هنوز آهنگی برای ${s.name} اضافه نشده.</div>`;
    return;
  }
  list.innerHTML = '';
  s.songs.forEach((song, i) => {
    const row = document.createElement('div');
    row.className = 'song-row';
    row.onclick = () => playSong(song, s.name);
    row.innerHTML = `<span class="num">${i + 1}</span><span class="title">${song.title}</span><span>▶</span>`;
    list.appendChild(row);
  });
}

function showGrid() {
  document.querySelector('.search-wrap').style.display = 'block';
  document.querySelector('.label-pill').style.display = 'block';
  grid.style.display = 'grid';
  songsView.style.display = 'none';
}

const audio = document.getElementById('audio');
const player = document.getElementById('player');
const playBtn = document.getElementById('playBtn');

function playSong(song, singerName) {
  audio.src = `${BASE_URL}/${song.file}`;
  audio.play();
  player.classList.add('active');
  player.classList.remove('paused');
  document.getElementById('pTitle').textContent = song.title;
  document.getElementById('pSinger').textContent = singerName;
  playBtn.textContent = '⏸';
}

function togglePlay() {
  if (audio.paused) {
    audio.play();
    playBtn.textContent = '⏸';
    player.classList.remove('paused');
  } else {
    audio.pause();
    playBtn.textContent = '▶';
    player.classList.add('paused');
  }
}

renderGrid(singers);
</script>

</body>
</html>
