<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P.I.F.E SONG</title>
<style>
  :root {
    --navy-deep: #050b18;
    --navy: #0b1526;
    --navy-light: #121f38;
    --panel: #0e192e;
    --border: #1c2c48;
    --blue: #2f8fe0;
    --blue-glow: #4fb3ff;
    --text: #eef3fb;
    --muted: #7c8bab;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: Tahoma, Vazirmatn, sans-serif;
    background: var(--navy-deep);
    color: var(--text);
  }
  #app {
    display: grid;
    grid-template-columns: 230px 1fr 300px;
    height: 100vh;
    overflow: hidden;
  }
  @media (max-width: 900px) {
    #app { grid-template-columns: 0 1fr 0; }
    #sidebar, #queuePanel { display: none; }
  }

  #sidebar {
    background: var(--navy);
    border-left: 1px solid var(--border);
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 22px;
    padding: 0 4px;
  }
  .logo-mark {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: radial-gradient(circle at 30% 30%, var(--blue-glow), var(--blue) 70%);
    box-shadow: 0 0 14px rgba(79,179,255,.5);
  }
  .logo-text { font-weight: 700; font-size: 16px; letter-spacing: .5px; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 8px;
    color: var(--muted); font-size: 13.5px; cursor: pointer;
    margin-bottom: 2px;
  }
  .nav-item.active, .nav-item:hover { background: var(--navy-light); color: var(--text); }

  .sidebar-label {
    color: var(--muted); font-size: 11px; letter-spacing: .5px;
    margin: 18px 6px 8px;
  }
  .singer-chip {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 8px; border-radius: 8px; cursor: pointer;
    margin-bottom: 2px;
  }
  .singer-chip:hover, .singer-chip.active { background: var(--navy-light); }
  .singer-chip img {
    width: 30px; height: 30px; border-radius: 7px; object-fit: cover; flex-shrink: 0;
    background: var(--navy-light);
  }
  .singer-chip .meta { min-width: 0; }
  .singer-chip .n { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .singer-chip .c { font-size: 10.5px; color: var(--muted); }

  #mainArea { overflow-y: auto; padding: 22px 26px 130px; }

  .search-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px; max-width: 420px; margin-bottom: 26px;
  }
  .search-row input {
    background: none; border: none; color: var(--text); flex: 1; font-size: 13.5px; outline: none;
  }
  .search-row input::placeholder { color: var(--muted); }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }
  .singer-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px; text-align: center; cursor: pointer;
    transition: transform .15s ease, border-color .15s ease;
  }
  .singer-card:hover { transform: translateY(-3px); border-color: var(--blue); box-shadow: 0 14px 28px rgba(0,0,0,.35); }
  .singer-photo {
    width: 84px; height: 84px; border-radius: 12px; margin: 0 auto 10px;
    background: var(--navy-light) center/cover no-repeat;
    position: relative; overflow: hidden;
    box-shadow: 0 6px 16px rgba(0,0,0,.35);
  }
  .singer-photo::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(120deg, rgba(255,255,255,.2), transparent 40%);
  }
  .singer-name { font-weight: 700; font-size: 13.5px; }
  .singer-count { font-size: 10.5px; color: var(--muted); margin-top: 4px; }

  #nowPlaying { display: none; margin-bottom: 30px; position: relative; }
  #nowPlaying.active { display: flex; gap: 30px; align-items: flex-start; }
  #nowPlaying::before {
    content: "";
    position: absolute;
    top: -30px; right: -30px; left: -30px; bottom: -30px;
    background: var(--np-bg, none);
    background-size: cover;
    background-position: center;
    filter: blur(60px) brightness(.35) saturate(1.3);
    z-index: -1;
    border-radius: 24px;
    opacity: .8;
    transition: background-image .4s ease;
  }
  .np-art {
    width: 260px; height: 260px; border-radius: 16px;
    background: var(--navy-light) center/cover no-repeat;
    box-shadow: 0 25px 60px rgba(0,0,0,.55), 0 0 40px rgba(47,143,224,.25);
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .np-art::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(115deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,.05) 22%, transparent 45%);
    pointer-events: none;
  }
  .np-info { padding-top: 10px; }
  .np-badge {
    display: inline-block; font-size: 11px; color: var(--blue-glow);
    border: 1px solid var(--blue); border-radius: 20px; padding: 3px 12px; margin-bottom: 14px;
  }
  .np-title { font-size: 30px; font-weight: 800; margin-bottom: 6px; }
  .np-artist { font-size: 15px; color: var(--muted); margin-bottom: 20px; }

  .np-seek { display: flex; align-items: center; gap: 10px; max-width: 420px; margin-bottom: 16px; }
  .np-seek .time { font-size: 11px; color: var(--muted); min-width: 32px; text-align: center; }
  .np-seek input[type="range"] { flex: 1; }

  .np-controls { display: flex; align-items: center; gap: 18px; }
  .np-controls button {
    background: none; border: none; color: var(--text); cursor: pointer; font-size: 14px;
  }
  .np-controls .big {
    width: 52px; height: 52px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--blue-glow), var(--blue) 75%);
    color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 4px rgba(47,143,224,.15), 0 0 26px rgba(79,179,255,.55);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .np-controls .big:hover {
    transform: scale(1.06);
    box-shadow: 0 0 0 6px rgba(47,143,224,.2), 0 0 34px rgba(79,179,255,.7);
  }

  .back-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    font-size: 13px; padding: 7px 14px; border-radius: 10px; cursor: pointer; margin-bottom: 16px;
  }
  .song-row {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 10px; border-radius: 10px; cursor: pointer;
  }
  .song-row:hover { background: var(--panel); }
  .song-row .num { width: 22px; text-align: center; color: var(--muted); font-size: 12px; flex-shrink: 0; }
  .song-row .title { flex: 1; font-size: 13.5px; min-width: 0; }
  .edit-title-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; }
  .edit-title-btn:hover { color: var(--blue-glow); }
  .empty-note { color: var(--muted); font-size: 13px; padding: 30px 4px; }

  #queuePanel {
    background: var(--navy);
    border-right: 1px solid var(--border);
    padding: 18px 16px;
    overflow-y: auto;
    display: none;
  }
  #queuePanel.active { display: block; }
  .queue-title { font-size: 13.5px; font-weight: 700; border-bottom: 2px solid var(--blue); display: inline-block; padding-bottom: 8px; margin-bottom: 14px; }
  .queue-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 6px; border-radius: 8px; cursor: pointer;
  }
  .queue-row:hover { background: var(--navy-light); }
  .queue-row img {
    width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
    background: var(--navy-light);
  }
  .queue-row .qt { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue-row .qs { font-size: 10.5px; color: var(--muted); }

  #bottomPlayer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--navy); border-top: 1px solid var(--border);
    padding: 10px 20px;
    display: none;
    align-items: center;
    gap: 18px;
    z-index: 10;
  }
  #bottomPlayer.active { display: flex; }
  .bp-track { display: flex; align-items: center; gap: 10px; width: 220px; flex-shrink: 0; }
  .bp-art { width: 46px; height: 46px; border-radius: 8px; background: var(--navy-light) center/cover no-repeat; flex-shrink: 0; }
  .bp-title { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bp-artist { font-size: 10.5px; color: var(--muted); }

  .bp-center { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bp-controls { display: flex; align-items: center; gap: 16px; }
  .bp-controls button { background: none; border: none; color: var(--text); cursor: pointer; font-size: 13px; }
  .bp-controls .play {
    width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--blue-glow);
    display: flex; align-items: center; justify-content: center; color: var(--blue-glow); font-size: 13px;
  }
  .bp-seek { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 520px; }
  .bp-seek .time { font-size: 10px; color: var(--muted); min-width: 28px; text-align: center; }
  .bp-seek input[type="range"] { flex: 1; }

  input[type="range"] {
    -webkit-appearance: none; height: 4px; border-radius: 2px;
    background: var(--border); cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%;
    background: var(--blue-glow); cursor: pointer;
  }

  /* ---------- پنل مدیریت ---------- */
  #adminOverlay {
    display: none;
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 50; align-items: center; justify-content: center;
  }
  #adminOverlay.active { display: flex; }
  #adminPanel {
    background: var(--navy); border: 1px solid var(--border);
    border-radius: 16px; width: 92%; max-width: 480px; max-height: 82vh;
    overflow-y: auto; padding: 20px;
  }
  #adminPanel h3 { margin: 0 0 14px; font-size: 15px; }
  #adminPanel label { font-size: 12px; color: var(--muted); display: block; margin: 12px 0 5px; }
  #adminPanel input[type="text"], #adminPanel input[type="password"], #adminPanel select {
    width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font-size: 13px;
  }
  #adminPanel .row-btns { display: flex; gap: 10px; margin-top: 16px; }
  #adminPanel button.primary {
    background: var(--blue); color: #fff; border: none; border-radius: 8px;
    padding: 9px 16px; font-size: 13px; cursor: pointer; flex: 1;
  }
  #adminPanel button.secondary {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 16px; font-size: 13px; cursor: pointer;
  }
  .admin-song-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .admin-song-row input { flex: 1; }
  #adminStatus { font-size: 12px; margin-top: 10px; color: var(--muted); }
</style>
</head>
<body>

<div id="app">

  <aside id="sidebar">
    <div class="logo-row">
      <div class="logo-mark"></div>
      <div class="logo-text">P.I.F.E SONG</div>
    </div>
    <div class="nav-item active" id="navHome" onclick="goHome()">خانه</div>
    <div class="nav-item" onclick="document.getElementById('sideSearch').focus()">جستجو</div>
    <div class="nav-item" onclick="openAdmin()">پنل مدیریت</div>
    <div class="sidebar-label">خواننده‌ها</div>
    <div id="sidebarSingers"></div>
  </aside>

  <main id="mainArea">
    <div class="search-row">
      <span>جستجو</span>
      <input id="sideSearch" type="text" placeholder="جستجوی خواننده یا آهنگ">
    </div>

    <div id="nowPlaying">
      <div class="np-art" id="npArt"></div>
      <div class="np-info">
        <div class="np-badge">در حال پخش</div>
        <div class="np-title" id="npTitle">-</div>
        <div class="np-artist" id="npArtist">-</div>
        <div class="np-seek">
          <span class="time" id="npCurrent">0:00</span>
          <input type="range" id="npSeek" min="0" max="100" value="0">
          <span class="time" id="npTotal">0:00</span>
        </div>
        <div class="np-controls">
          <button onclick="prevSong()">قبلی</button>
          <button class="big" onclick="togglePlay()" id="npPlayBtn">▶</button>
          <button onclick="nextSong()">بعدی</button>
        </div>
      </div>
    </div>

    <div id="browseView">
      <div id="grid"></div>
    </div>

    <div id="songsView" style="display:none;">
      <button class="back-btn" onclick="showBrowse()">→ بازگشت به خواننده‌ها</button>
      <div id="songsList"></div>
    </div>
  </main>

  <aside id="queuePanel">
    <div class="queue-title">بعدی در صف</div>
    <div id="queueList"></div>
  </aside>

</div>

<div id="bottomPlayer">
  <div class="bp-track">
    <div class="bp-art" id="bpArt"></div>
    <div>
      <div class="bp-title" id="bpTitle">-</div>
      <div class="bp-artist" id="bpArtist">-</div>
    </div>
  </div>
  <div class="bp-center">
    <div class="bp-controls">
      <button onclick="prevSong()">قبلی</button>
      <button class="play" onclick="togglePlay()" id="bpPlayBtn">▶</button>
      <button onclick="nextSong()">بعدی</button>
    </div>
    <div class="bp-seek">
      <span class="time" id="bpCurrent">0:00</span>
      <input type="range" id="bpSeek" min="0" max="100" value="0">
      <span class="time" id="bpTotal">0:00</span>
    </div>
  </div>
</div>

<div id="adminOverlay">
  <div id="adminPanel">
    <h3>پنل مدیریت — ویرایش اسم آهنگ‌ها برای همه</h3>

    <label>توکن GitHub (فقط یک‌بار وارد کنید، ذخیره میشه)</label>
    <input type="password" id="adminToken" placeholder="ghp_xxxxxxxxxxxx">

    <label>خواننده</label>
    <select id="adminSingerSelect"></select>

    <div class="row-btns">
      <button class="primary" onclick="adminLoadSongs()">بارگذاری آهنگ‌ها</button>
      <button class="secondary" onclick="closeAdmin()">بستن</button>
    </div>

    <div id="adminSongsList" style="margin-top:16px;"></div>

    <div class="row-btns" id="adminSaveRow" style="display:none;">
      <button class="primary" onclick="adminSaveAll()">ذخیره برای همه</button>
    </div>

    <div id="adminStatus"></div>
  </div>
</div>

<audio id="audio"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.7/jsmediatags.min.js"></script>
<script>
const GH_USER = "rezaeian1388-bot";
const GH_REPO = "P.I.F.E";
const API_URL = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/songs`;

const singers = [
  { id: 1,  name: "گوگوش",          slug: "googoosh",            photo: "1.jpg"  },
  { id: 2,  name: "هایده",          slug: "hayedeh",             photo: "2.jpg"  },
  { id: 3,  name: "مهستی",          slug: "mahasti",             photo: "3.jpg"  },
  { id: 4,  name: "حمیرا",          slug: "homeira",             photo: "4.jpg"  },
  { id: 5,  name: "ویگن",           slug: "vigen",                photo: "5.jpg"  },
  { id: 6,  name: "داریوش",         slug: "dariush",              photo: "6.jpg"  },
  { id: 7,  name: "ابی",            slug: "ebi",                  photo: "7.jpg"  },
  { id: 8,  name: "عارف",           slug: "aref",                 photo: "8.jpg"  },
  { id: 9,  name: "سیاوش قمیشی",    slug: "siavash-ghomayshi",   photo: "9.jpg"  },
  { id: 10, name: "ستار",           slug: "sattar",               photo: "10.jpg" },
  { id: 11, name: "شاهرخ",          slug: "shahrokh",             photo: "11.jpg" },
  { id: 12, name: "حسن شماعی‌زاده", slug: "hassan-shamaeezadeh", photo: "12.jpg" },
  { id: 13, name: "معین",           slug: "moein",                photo: "13.jpg" },
  { id: 14, name: "حبیب",           slug: "habib",                photo: "14.jpg" },
  { id: 15, name: "لیلا فروهر",     slug: "leila-forouhar",      photo: "15.jpg" },
  { id: 16, name: "ایرج",           slug: "iraj",                 photo: "16.jpg" },
  { id: 17, name: "فتانه",          slug: "fataneh",              photo: "17.jpg" }
];

const RAW_BASE = `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main`;
function photoURL(photo) { return `${RAW_BASE}/${photo}`; }

function finglishToPersian(text) {
  let s = text.toLowerCase();
  const map = [
    ['kh','خ'],['gh','ق'],['sh','ش'],['ch','چ'],['zh','ژ'],['th','ث'],['ph','ف'],
    ['aa','آ'],['ee','ی'],['oo','و'],['ou','و'],['ei','ی'],
    ['a','ا'],['b','ب'],['c','ک'],['d','د'],['e','ه'],['f','ف'],
    ['g','گ'],['h','ه'],['i','ی'],['j','ج'],['k','ک'],['l','ل'],
    ['m','م'],['n','ن'],['o','و'],['p','پ'],['q','ق'],['r','ر'],
    ['s','س'],['t','ت'],['u','و'],['v','و'],['w','و'],['y','ی'],['z','ز']
  ];
  let out = '', i = 0;
  while (i < s.length) {
    if (s[i] === ' ') { out += ' '; i++; continue; }
    let matched = false;
    for (const [lat, per] of map) {
      if (s.startsWith(lat, i)) { out += per; i += lat.length; matched = true; break; }
    }
    if (!matched) i++;
  }
  return out;
}
function cleanTitle(filename, singerSlug) {
  let name = filename.replace(/\.[a-zA-Z0-9]+$/, '');
  name = name.replace(/\(.*?\)/g, ' ').replace(/\[.*?\]/g, ' ');
  name = name.replace(/[_-]/g, ' ');
  name = name.replace(/\b\d{2,4}\b/g, ' ');
  const singerRegex = new RegExp(singerSlug.replace(/-/g, '.?'), 'gi');
  name = name.replace(singerRegex, ' ').trim().replace(/\s+/g, ' ');
  return finglishToPersian(name) || name;
}
function normalize(s) { return s.toLowerCase().replace(/[^a-z0-9]/g, ''); }

function ghHeaders() {
  const token = localStorage.getItem('gh_admin_token');
  return token ? { Authorization: `token ${token}` } : {};
}

let _rootFilesPromise = null;
function fetchRootFiles() {
  if (!_rootFilesPromise) {
    _rootFilesPromise = fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/`, { headers: ghHeaders() })
      .then(r => r.ok ? r.json() : []).catch(() => []);
  }
  return _rootFilesPromise;
}

async function fetchSongs(singer) {
  const results = [];
  let rateLimited = false;
  try {
    const res = await fetch(`${API_URL}/${singer.slug}`, { headers: ghHeaders() });
    if (res.status === 403) rateLimited = true;
    if (res.ok) {
      const data = await res.json();
      data.filter(f => f.type === 'file' && f.name !== 'placeholder.txt')
        .forEach(f => results.push({ title: cleanTitle(f.name, singer.slug), file: f.download_url }));
    }
  } catch (e) {}
  const rootFiles = await fetchRootFiles();
  const slugNorm = normalize(singer.slug.replace(/-/g, ''));
  rootFiles
    .filter(f => f.type === 'file' && /\.(mp3|m4a|wav|aac)$/i.test(f.name))
    .filter(f => normalize(f.name).startsWith(slugNorm))
    .forEach(f => results.push({ title: cleanTitle(f.name, singer.slug), file: f.download_url }));
  results.rateLimited = rateLimited;
  return results;
}

function getTitleOverride(fileUrl) { try { return localStorage.getItem('title:' + fileUrl); } catch (e) { return null; } }
function setTitleOverride(fileUrl, title) { try { localStorage.setItem('title:' + fileUrl, title); } catch (e) {} }

/* ---------- سیستم تغییرات سراسری (برای همه) از طریق overrides.json ---------- */
const OVERRIDES_PATH = 'overrides.json';
let globalOverrides = null; // { fileUrl: title }
let globalOverridesLoaded = false;

async function loadGlobalOverrides() {
  if (globalOverridesLoaded) return globalOverrides;
  try {
    const res = await fetch(`${RAW_BASE}/${OVERRIDES_PATH}?t=${Date.now()}`);
    globalOverrides = res.ok ? await res.json() : {};
  } catch (e) {
    globalOverrides = {};
  }
  globalOverridesLoaded = true;
  return globalOverrides;
}

function b64EncodeUnicode(str) {
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1)));
}

/* ---------- پنل مدیریت ---------- */
function openAdmin() {
  const select = document.getElementById('adminSingerSelect');
  select.innerHTML = singers.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  document.getElementById('adminToken').value = localStorage.getItem('gh_admin_token') || '';
  document.getElementById('adminOverlay').classList.add('active');
}
function closeAdmin() { document.getElementById('adminOverlay').classList.remove('active'); }

let adminCurrentSongs = [];
let adminCurrentSinger = null;

async function adminLoadSongs() {
  const token = document.getElementById('adminToken').value.trim();
  if (token) localStorage.setItem('gh_admin_token', token);

  const id = parseInt(document.getElementById('adminSingerSelect').value);
  adminCurrentSinger = singers.find(s => s.id === id);
  const status = document.getElementById('adminStatus');
  status.textContent = 'در حال بارگذاری...';

  await loadGlobalOverrides();
  const songs = await fetchSongs(adminCurrentSinger);
  songs.forEach(s => { if (globalOverrides[s.file]) s.title = globalOverrides[s.file]; });
  adminCurrentSongs = songs;

  const list = document.getElementById('adminSongsList');
  list.innerHTML = '';
  songs.forEach((song, i) => {
    const row = document.createElement('div');
    row.className = 'admin-song-row';
    row.innerHTML = `<input type="text" data-file="${song.file}" value="${song.title.replace(/"/g, '&quot;')}">`;
    list.appendChild(row);
  });
  document.getElementById('adminSaveRow').style.display = songs.length ? 'flex' : 'none';
  status.textContent = songs.length ? `${songs.length} آهنگ بارگذاری شد.` : 'آهنگی پیدا نشد.';
}

async function adminSaveAll() {
  const token = document.getElementById('adminToken').value.trim();
  const status = document.getElementById('adminStatus');
  if (!token) { status.textContent = 'اول توکن GitHub رو وارد کنید.'; return; }

  status.textContent = 'در حال ذخیره...';
  const inputs = document.querySelectorAll('#adminSongsList input');

  try {
    // گرفتن نسخه فعلی overrides.json (برای sha لازم برای آپدیت)
    const getRes = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${OVERRIDES_PATH}`, {
      headers: { Authorization: `token ${token}` }
    });
    let sha = undefined;
    let current = {};
    if (getRes.ok) {
      const data = await getRes.json();
      sha = data.sha;
      current = JSON.parse(decodeURIComponent(escape(atob(data.content))));
    }

    inputs.forEach(inp => { current[inp.dataset.file] = inp.value.trim(); });

    const putRes = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${OVERRIDES_PATH}`, {
      method: 'PUT',
      headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: 'به‌روزرسانی اسم آهنگ‌ها از پنل مدیریت',
        content: b64EncodeUnicode(JSON.stringify(current, null, 2)),
        sha
      })
    });

    if (putRes.ok) {
      globalOverrides = current;
      globalOverridesLoaded = true;
      status.textContent = 'ذخیره شد! این تغییر برای همه اعمال میشه.';

      // آپدیت فوری لیست آهنگ‌های خواننده‌ای که الان بازه، بدون نیاز به رفرش دستی
      if (currentSinger) {
        currentQueue.forEach(song => {
          if (globalOverrides[song.file]) song.title = globalOverrides[song.file];
        });
        const songsList = document.getElementById('songsList');
        if (songsList) {
          const titleEls = songsList.querySelectorAll('[data-song-file]');
          titleEls.forEach(el => {
            const file = el.dataset.songFile;
            if (globalOverrides[file]) el.textContent = globalOverrides[file];
          });
        }
      }
    } else {
      const err = await putRes.json();
      status.textContent = 'خطا: ' + (err.message || 'ذخیره نشد. توکن رو چک کنید.');
    }
  } catch (e) {
    status.textContent = 'خطا در ارتباط با GitHub.';
  }
}

const sidebarSingers = document.getElementById('sidebarSingers');
function renderSidebar() {
  sidebarSingers.innerHTML = '';
  singers.forEach(s => {
    const chip = document.createElement('div');
    chip.className = 'singer-chip';
    chip.onclick = () => openSinger(s.id);
    chip.innerHTML = `<img src="${photoURL(s.photo)}" onerror="this.style.display='none'">
      <div class="meta"><div class="n">${s.name}</div><div class="c">خواننده</div></div>`;
    sidebarSingers.appendChild(chip);
  });
}
renderSidebar();

const grid = document.getElementById('grid');
function renderGrid(list) {
  grid.innerHTML = '';
  list.forEach(s => {
    const card = document.createElement('div');
    card.className = 'singer-card';
    card.onclick = () => openSinger(s.id);
    card.innerHTML = `<div class="singer-photo" style="background-image:url('${photoURL(s.photo)}')"></div>
      <div class="singer-name">${s.name}</div><div class="singer-count">خواننده</div>`;
    grid.appendChild(card);
  });
}
renderGrid(singers);

document.getElementById('sideSearch').addEventListener('input', (e) => {
  const q = e.target.value.trim();
  showBrowse();
  renderGrid(q ? singers.filter(s => s.name.includes(q)) : singers);
});

function showBrowse() {
  document.getElementById('browseView').style.display = 'block';
  document.getElementById('songsView').style.display = 'none';
}
function goHome() {
  document.getElementById('sideSearch').value = '';
  renderGrid(singers);
  showBrowse();
}

let currentSinger = null;
let currentQueue = [];
let currentIndex = -1;

async function openSinger(id) {
  const s = singers.find(x => x.id === id);
  currentSinger = s;
  document.getElementById('browseView').style.display = 'none';
  document.getElementById('songsView').style.display = 'block';

  const list = document.getElementById('songsList');
  list.innerHTML = `<div class="empty-note">در حال دریافت آهنگ‌های ${s.name}...</div>`;

  const songs = await fetchSongs(s);
  await loadGlobalOverrides();
  songs.forEach(song => {
    if (globalOverrides[song.file]) song.title = globalOverrides[song.file];
    const ov = getTitleOverride(song.file);
    if (ov) song.title = ov;
  });
  currentQueue = songs;

  if (songs.length === 0) {
    const hint = songs.rateLimited
      ? `سایت به‌طور موقت زیاد به GitHub درخواست زده و محدود شده (Rate Limit). چند دقیقه صبر کنید، یا توکن رو از پنل مدیریت وارد کنید تا این محدودیت خیلی بالاتر بره.`
      : `هنوز آهنگی برای ${s.name} آپلود نشده.`;
    list.innerHTML = `<div class="empty-note">${hint}</div>`;
    return;
  }
  list.innerHTML = '';
  songs.forEach((song, i) => {
    const row = document.createElement('div');
    row.className = 'song-row';

    const num = document.createElement('span');
    num.className = 'num'; num.textContent = i + 1;
    num.onclick = () => playAt(i);

    const title = document.createElement('span');
    title.className = 'title'; title.textContent = song.title;
    title.dataset.songFile = song.file;
    title.onclick = () => playAt(i);

    const editBtn = document.createElement('button');
    editBtn.className = 'edit-title-btn'; editBtn.textContent = '✎'; editBtn.title = 'ویرایش اسم';
    editBtn.onclick = (e) => {
      e.stopPropagation();
      const nt = prompt('اسم درست آهنگ رو بنویسید:', song.title);
      if (nt && nt.trim()) {
        song.title = nt.trim();
        setTitleOverride(song.file, song.title);
        title.textContent = song.title;
        renderQueue();
      }
    };

    row.appendChild(num); row.appendChild(title); row.appendChild(editBtn);
    list.appendChild(row);
  });
}

const audio = document.getElementById('audio');
const nowPlaying = document.getElementById('nowPlaying');
const bottomPlayer = document.getElementById('bottomPlayer');
const queuePanel = document.getElementById('queuePanel');

function formatTime(sec) {
  if (!isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function playAt(index) {
  if (!currentQueue[index]) return;
  currentIndex = index;
  const song = currentQueue[index];
  audio.src = song.file;
  audio.play();

  const fallbackArt = photoURL(currentSinger.photo);
  setArtwork(fallbackArt, song, currentSinger);

  // تلاش برای خوندن عکس ذخیره‌شده داخل خود فایل mp3
  if (typeof jsmediatags !== 'undefined') {
    jsmediatags.read(song.file, {
      onSuccess: function (tag) {
        if (currentIndex !== index) return; // کاربر آهنگ رو عوض کرده، این نتیجه دیگه لازم نیست
        const pic = tag.tags.picture;
        if (pic) {
          let base64 = '';
          for (let i = 0; i < pic.data.length; i++) base64 += String.fromCharCode(pic.data[i]);
          const dataUrl = `data:${pic.format};base64,${window.btoa(base64)}`;
          setArtwork(dataUrl, song, currentSinger);
        }
      },
      onError: function () { /* عکسی توی فایل نبود، همون عکس خواننده می‌مونه */ }
    });
  }

  nowPlaying.classList.add('active');
  bottomPlayer.classList.add('active');
  queuePanel.classList.add('active');
  setPlayIcon('⏸');
  renderQueue();
}

function setArtwork(art, song, singer) {
  document.getElementById('npArt').style.backgroundImage = `url('${art}')`;
  document.getElementById('nowPlaying').style.setProperty('--np-bg', `url('${art}')`);
  document.getElementById('npTitle').textContent = song.title;
  document.getElementById('npArtist').textContent = singer.name;
  document.getElementById('bpArt').style.backgroundImage = `url('${art}')`;
  document.getElementById('bpTitle').textContent = song.title;
  document.getElementById('bpArtist').textContent = singer.name;

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title,
      artist: singer.name,
      album: 'P.I.F.E SONG',
      artwork: [
        { src: art, sizes: '256x256', type: 'image/jpeg' },
        { src: art, sizes: '512x512', type: 'image/jpeg' }
      ]
    });
    navigator.mediaSession.setActionHandler('play', () => { audio.play(); setPlayIcon('⏸'); });
    navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); setPlayIcon('▶'); });
    navigator.mediaSession.setActionHandler('previoustrack', prevSong);
    navigator.mediaSession.setActionHandler('nexttrack', nextSong);
  }
}
function nextSong() { if (currentIndex + 1 < currentQueue.length) playAt(currentIndex + 1); }
function prevSong() { if (currentIndex > 0) playAt(currentIndex - 1); }
audio.addEventListener('ended', nextSong);

function setPlayIcon(icon) {
  document.getElementById('npPlayBtn').textContent = icon;
  document.getElementById('bpPlayBtn').textContent = icon;
}
function togglePlay() {
  if (!audio.src) return;
  if (audio.paused) { audio.play(); setPlayIcon('⏸'); }
  else { audio.pause(); setPlayIcon('▶'); }
}

function renderQueue() {
  const list = document.getElementById('queueList');
  list.innerHTML = '';
  currentQueue.forEach((song, i) => {
    if (i === currentIndex) return;
    const row = document.createElement('div');
    row.className = 'queue-row';
    row.onclick = () => playAt(i);
    row.innerHTML = `<img src="${photoURL(currentSinger.photo)}">
      <div><div class="qt">${song.title}</div><div class="qs">${currentSinger.name}</div></div>`;
    list.appendChild(row);
  });
}

function wireSeek(seekEl, curEl, totEl) {
  audio.addEventListener('loadedmetadata', () => {
    seekEl.max = audio.duration; totEl.textContent = formatTime(audio.duration);
  });
  audio.addEventListener('timeupdate', () => {
    if (!seekEl.dragging) { seekEl.value = audio.currentTime; curEl.textContent = formatTime(audio.currentTime); }
  });
  seekEl.addEventListener('input', () => { seekEl.dragging = true; curEl.textContent = formatTime(seekEl.value); });
  seekEl.addEventListener('change', () => { audio.currentTime = seekEl.value; seekEl.dragging = false; });
}
wireSeek(document.getElementById('npSeek'), document.getElementById('npCurrent'), document.getElementById('npTotal'));
wireSeek(document.getElementById('bpSeek'), document.getElementById('bpCurrent'), document.getElementById('bpTotal'));
</script>
